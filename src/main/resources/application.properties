spring.application.name=expensetracker

spring.datasource.url = ${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET:s3cR3tK3y!@#4567890qwertyuiopasdfgh}
jwt.expiration=${JWT_EXPIRATION:3600000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

baseUrl=pjsofttech

spring.security.oauth2.client.registration.google.client-id=${OAUTH2ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email
