name: Deploy Expense Tracker Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 4. Upload JAR to EC2
      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/expensetracker-*.jar"
          target: "/home/ec2-user/"

      # 5. Deploy and restart Spring Boot
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            set -e

            echo "Moving JAR to application directory..."

            cd /opt/expense-backend/

            sudo rm -rf *

            sudo mv /home/ec2-user/target/expensetracker-*.jar /opt/expense-backend/

            cd /home/ec2-user/

            sudo rm -rf target

            echo "Reloading systemd..."

            sudo systemctl daemon-reload

            echo "Restarting Expense-Tracker backend..."

            sudo systemctl restart expense-backend

            echo "Checking service status..."

            sudo systemctl status expense-backend --no-pager

            echo "Deployment completed successfully!"